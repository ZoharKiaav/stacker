name: Build and Push Stacker to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tags
        shell: bash
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          IMAGE_BASE="ghcr.io/${REPO_LC}/stacker"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          REF_TAG="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"

          echo "IMAGE_BASE=${IMAGE_BASE}" >> "$GITHUB_ENV"
          echo "SHA_TAG=${SHA_TAG}" >> "$GITHUB_ENV"
          echo "REF_TAG=${REF_TAG}" >> "$GITHUB_ENV"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "PUBLISH_LATEST=true" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_LATEST=false" >> "$GITHUB_ENV"
          fi

      - name: Log in to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Create production environment file
        shell: bash
        run: |
          cat > .env.production <<'EOF'
          NODE_ENV=production
          NEXT_PUBLIC_APP_NAME=Stacker
          NEXT_PUBLIC_PAGE_TITLE=Stacker
          NEXT_PUBLIC_SITE_URL=https://stacker.proniit.com
          EOF

      - name: Build image
        shell: bash
        run: |
          TAGS=(
            -t "${IMAGE_BASE}:${SHA_TAG}"
            -t "${IMAGE_BASE}:${REF_TAG}"
          )

          if [ "${PUBLISH_LATEST}" = "true" ]; then
            TAGS+=(-t "${IMAGE_BASE}:latest")
          fi

          docker build --progress=plain "${TAGS[@]}" .

      - name: Push image
        shell: bash
        run: |
          docker push "${IMAGE_BASE}:${SHA_TAG}"
          docker push "${IMAGE_BASE}:${REF_TAG}"

          if [ "${PUBLISH_LATEST}" = "true" ]; then
            docker push "${IMAGE_BASE}:latest"
          fi
